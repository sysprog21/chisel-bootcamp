# Versions that Dependabot cannot see (the Dockerfile ENVs, `source/load-ivy.sc`, `binder/postBuild`,
# `Install.md` and `README.md`) are kept in agreement by `tools/check-versions.py` instead.
version: 2
updates:
  # Keep the GitHub Actions used by the workflows current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Keep the base image of the Dockerfile current
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

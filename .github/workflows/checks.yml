name: Checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Versions and notebooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Pinned versions agree (and firtool matches Chisel)
        run: python3 tools/check-versions.py
      - name: Notebooks have no outputs (see CONTRIBUTING.md)
        # the nbstripout hook (and its pinned version) of .pre-commit-config.yaml; fails if it would strip
        run: pipx run pre-commit run nbstripout --all-files --show-diff-on-failure
      - name: Notebook lint (each rule is first checked against a seeded violation)
        run: python3 tests/test_notebooks.py --self-test

name: Publish Docker image to DockerHub

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: docker-dev-${{ github.ref }}
  cancel-in-progress: true

# https://docs.docker.com/build/ci/github-actions/multi-platform/
jobs:
  docker:
    name: Build Docker Image and Publish (only on push)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build image for the smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: chisel-bootcamp:test
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build

      - name: Run notebooks (smoke test, offline)
        # The image bundles every dependency, so no network is needed.
        run: |
          docker run --rm --network none chisel-bootcamp:test \
            python3 runtest.py 0_demo.ipynb 2.1_first_module.ipynb 2.6_chiselsim.ipynb 4.1_firrtl_ast.ipynb
          docker run --rm --network none chisel-bootcamp:test python3 tests/test_visualizer.py

      # Build every platform on pull requests too, so a platform-specific break (such as a
      # package missing for Arm64) fails before merge; only a push to dev publishes.
      - name: Build all platforms (push only on push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: sysprog21/chisel-bootcamp:latest
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build
